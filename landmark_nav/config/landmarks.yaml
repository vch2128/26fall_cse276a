# Landmark map for HW2.
# World frame: origin = robot start pose (0, 0, 0), +x = initial facing direction,
# +y = to the robot's left, theta CCW-positive.
#
# Keys MUST be YOLO class names (COCO names for a stock model, e.g. 'teddy bear',
# 'potted plant', 'suitcase', 'tv', 'umbrella', 'backpack'), and each class must
# appear only ONCE in the room, or the detector can't tell them apart.
# Avoid classes the lab is full of (chair, tv/monitor, bottle, person).
#
# x, y   = landmark center on the floor (tape-measured, meters)
# height = real height of the object (meters) -> range from box height
#
# TODO: these positions are a starting suggestion for the path
#   (0,0,0) -> (1,0,0) -> (1,2,pi) -> (0,0,0); measure the real values.
landmarks:
  cup:        {x: 0.5, y: 2.0, height: 0.115} #0.115
  wine glass: {x: 1.4, y: 0.0, height: 0.215}
  bowl:       {x: 1.0, y: 2.3, height: 0.085}
  bottle:     {x: 1.4, y: 1.0, height: 0.115}
  laptop:     {x: -0.4, y: -0.4, height: 0.227}   # seen at waypoint 3 (facing +x, theta = 0)ß